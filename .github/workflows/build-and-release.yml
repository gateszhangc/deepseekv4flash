name: Build And Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deepseekv4flash-release
  cancel-in-progress: true

env:
  APP_NAME: deepseekv4flash
  BUILD_NAMESPACE: ${{ vars.K8S_BUILD_NAMESPACE || 'webapp-build' }}
  BUILD_SERVICE_ACCOUNT: ${{ vars.K8S_BUILD_SERVICE_ACCOUNT || 'kaniko-builder' }}
  REGISTRY_SECRET_NAME: ${{ vars.K8S_DOCKER_CONFIG_SECRET || 'webapp-registry-push' }}
  GIT_AUTH_SECRET_NAME: ${{ vars.K8S_GITHUB_TOKEN_SECRET || 'github-repo-reader' }}
  GIT_AUTH_SECRET_KEY: ${{ vars.K8S_GITHUB_TOKEN_KEY || 'token' }}
  IMAGE_NAME: ${{ vars.KUSTOMIZATION_IMAGE_NAME || 'registry.144.91.77.245.sslip.io/deepseekv4flash' }}
  KUSTOMIZATION_FILE: deploy/k8s/overlays/prod/kustomization.yaml
  K8S_JOB_TTL_SECONDS: ${{ vars.K8S_JOB_TTL_SECONDS || '600' }}

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          CONFIG_DATA="${KUBECONFIG_B64:-${KUBE_CONFIG_DATA:-${KUBE_CONFIG_B64:-${KUBE_CONFIG:-}}}}"
          if [[ -z "$CONFIG_DATA" ]]; then
            echo "Missing kubeconfig secret. Set KUBECONFIG_B64, KUBE_CONFIG_DATA, KUBE_CONFIG_B64, or KUBE_CONFIG."
            exit 1
          fi
          printf '%s' "$CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"

      - name: Run K8s build job
        id: build_job
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/submit_k8s_build_job.sh
          JOB_NAME="$(bash scripts/submit_k8s_build_job.sh)"
          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for K8s build job
        shell: bash
        env:
          JOB_NAME: ${{ steps.build_job.outputs.job_name }}
        run: |
          set -euo pipefail
          if ! kubectl wait --for=condition=complete "job/$JOB_NAME" -n "$BUILD_NAMESPACE" --timeout=30m; then
            kubectl describe "job/$JOB_NAME" -n "$BUILD_NAMESPACE" || true
            kubectl logs "job/$JOB_NAME" -n "$BUILD_NAMESPACE" --all-containers=true || true
            exit 1
          fi

      - name: Update kustomization image tag
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/sync_kustomize_image_tag.py "$KUSTOMIZATION_FILE" "$IMAGE_NAME" "$IMAGE_TAG"

      - name: Commit manifest update
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$KUSTOMIZATION_FILE"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KUSTOMIZATION_FILE"
          git commit -m "chore: release ${IMAGE_TAG} [skip ci]"
          git push origin HEAD:main
